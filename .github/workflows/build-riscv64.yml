name: Build RISC-V64

on:
  workflow_dispatch:
    inputs:
      etcher_version:
        description: 'Etcher version tag to build'
        default: 'v2.1.4'
        required: false
  push:
    tags: ['v*']

env:
  NODE_OPTIONS: "--jitless"
  MAKEFLAGS: "-j8"
  ELECTRON_VERSION: "37.2.4"
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  ELECTRON_CACHE_DIR: "${{ github.workspace }}/.cache/electron"
  ELECTRON_EXTRACT_DIR: "${{ github.workspace }}/.cache/electron-riscv64"

jobs:
  build:
    name: Build balenaEtcher riscv64
    runs-on: [self-hosted, linux, riscv64]
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.etcher_version || github.ref }}

      - name: Verify environment
        run: |
          echo "Architecture: $(uname -m)"
          if [ "$(uname -m)" != "riscv64" ]; then
            echo "::error::Expected riscv64, got $(uname -m)"
            exit 1
          fi
          echo "Node.js: $(node --version)"
          echo "npm: $(npm --version)"
          echo "node-gyp: $(node-gyp --version 2>/dev/null || echo 'not found')"

      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 git curl wget unzip \
            pkg-config fakeroot dpkg rpm jq \
            libusb-1.0-0-dev libudev-dev libsecret-1-dev \
            liblzma-dev bzip2

          # Electron runtime dependencies (Debian Trixie lib names with t64 suffix)
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 libatk1.0-0t64 libcairo2 libcups2t64 \
            libdbus-1-3 libexpat1 libfontconfig1 libfreetype6 \
            libgbm1 libgdk-pixbuf-2.0-0 libglib2.0-0t64 \
            libgtk-3-0t64 liblzma5 libnotify4 libnspr4 libnss3 \
            libpango-1.0-0 libx11-6 libxcomposite1 libxcursor1 \
            libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 \
            libxrender1 libxss1 libxtst6 || true

      - name: Download riscv64 Electron binary
        run: |
          mkdir -p "$ELECTRON_CACHE_DIR" "$ELECTRON_EXTRACT_DIR"
          ELECTRON_ZIP="$ELECTRON_CACHE_DIR/electron-v${ELECTRON_VERSION}-linux-riscv64.zip"
          ELECTRON_URL="https://github.com/riscv-forks/electron-riscv-releases/releases/download/v${ELECTRON_VERSION}.riscv1/electron-v${ELECTRON_VERSION}-linux-riscv64.zip"

          if [ ! -f "$ELECTRON_ZIP" ]; then
            echo "Downloading Electron riscv64..."
            wget -q --show-progress -O "$ELECTRON_ZIP" "$ELECTRON_URL"
          else
            echo "Using cached Electron zip"
          fi

          unzip -tq "$ELECTRON_ZIP" || { echo "::error::Electron zip is corrupt"; exit 1; }
          rm -rf "${ELECTRON_EXTRACT_DIR:?}"/*
          unzip -qo "$ELECTRON_ZIP" -d "$ELECTRON_EXTRACT_DIR"
          chmod +x "$ELECTRON_EXTRACT_DIR/electron"

      - name: Install npm dependencies
        env:
          ELECTRON_OVERRIDE_DIST_PATH: "${{ env.ELECTRON_EXTRACT_DIR }}"
          electron_config_cache: "${{ env.ELECTRON_CACHE_DIR }}"
          npm_config_arch: riscv64
          npm_config_target_arch: riscv64
        run: |
          # Remove Windows-only optional dependency
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (pkg.optionalDependencies) delete pkg.optionalDependencies['winusb-driver-generator'];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm install --ignore-scripts 2>&1 || npm install --ignore-scripts --force 2>&1

      - name: Rebuild native modules
        env:
          ELECTRON_OVERRIDE_DIST_PATH: "${{ env.ELECTRON_EXTRACT_DIR }}"
          npm_config_arch: riscv64
          npm_config_target_arch: riscv64
        run: |
          for mod in usb lzma-native drivelist mountutils xxhash-addon @ronomon/direct-io bufferutil utf-8-validate; do
            echo "Rebuilding $mod..."
            npm rebuild "$mod" 2>&1 || echo "::warning::$mod rebuild failed (may be optional)"
          done

      - name: Apply riscv64 patches
        env:
          ELECTRON_OVERRIDE_DIST_PATH: "${{ env.ELECTRON_EXTRACT_DIR }}"
        run: bash .github/riscv64/patch-all.sh

      - name: "Build: electron-forge package"
        env:
          ELECTRON_OVERRIDE_DIST_PATH: "${{ env.ELECTRON_EXTRACT_DIR }}"
          electron_config_cache: "${{ env.ELECTRON_CACHE_DIR }}"
        run: |
          echo "Building balenaEtcher for riscv64 (~30 min in --jitless mode)..."
          npx electron-forge package --platform=linux --arch=riscv64

      - name: "Build: .deb installer"
        env:
          ELECTRON_OVERRIDE_DIST_PATH: "${{ env.ELECTRON_EXTRACT_DIR }}"
          electron_config_cache: "${{ env.ELECTRON_CACHE_DIR }}"
        run: |
          npx electron-forge make --platform=linux --arch=riscv64 \
            --targets=@electron-forge/maker-deb 2>&1 || \
            echo "::warning::.deb maker failed — packaged app still available in out/"

      - name: Report build results
        if: always()
        run: |
          echo "## Build Output" >> "$GITHUB_STEP_SUMMARY"
          if [ -d out ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            du -sh out/* 2>/dev/null >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Installer artifacts" >> "$GITHUB_STEP_SUMMARY"
            find out -name "*.deb" -o -name "*.rpm" -o -name "*.zip" 2>/dev/null | while read -r f; do
              size=$(du -h "$f" | cut -f1)
              echo "- \`$(basename "$f")\` ($size)" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "No output directory found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload packaged app
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: balenaEtcher-linux-riscv64
          path: out/balenaEtcher-linux-riscv64/
          retention-days: 30

      - name: Upload .deb installer
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: balenaEtcher-riscv64-deb
          path: out/make/deb/riscv64/*.deb
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          DEB_FILE=$(find out/make/deb/riscv64 -name "*.deb" 2>/dev/null | head -1)

          NOTES="RISC-V 64-bit build of balenaEtcher $TAG.

          Built on Debian Trixie riscv64 with Electron ${ELECTRON_VERSION} from riscv-forks.

          **Requirements:** Debian Trixie (or compatible) on riscv64 hardware.

          **Known limitations:**
          - Runs with --jitless (V8 interpreter-only) for stability on current riscv64 hardware
          - .xz image support may be unavailable (lzma-native build issue)"

          UPLOAD_FILES=()
          if [ -n "$DEB_FILE" ]; then
            UPLOAD_FILES+=("$DEB_FILE")
          fi

          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, uploading assets..."
            if [ ${#UPLOAD_FILES[@]} -gt 0 ]; then
              gh release upload "$TAG" "${UPLOAD_FILES[@]}" --clobber
            fi
          else
            gh release create "$TAG" \
              --title "balenaEtcher $TAG (riscv64)" \
              --notes "$NOTES" \
              "${UPLOAD_FILES[@]}"
          fi
